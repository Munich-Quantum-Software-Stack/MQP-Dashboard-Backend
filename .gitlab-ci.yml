# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml

# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: dockerhub.quantum.lrz.de/python-gcc-jre:3.11_12.1_17.0.14

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PDM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pdm"

  # Keep the repo's private index settings (important!)
  PIP_EXTRA_INDEX_URL: "https://pypi.quantum.lrz.de/"
  PIP_TRUSTED_HOST: "pypi.quantum.lrz.de"

  # Keep existing test env vars (if tests rely on them)
  QUANTUM_DS_HOST: "ldap://localhost:25334"
  QUANTUM_DB_FILENAME: "test_db.db"
  QUANTUM_DB_TESTING: "1"

  # PDM CI niceties
  PDM_IGNORE_SAVED_PYTHON: "1"
  PDM_CHECK_UPDATE: "0"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip
    - .cache/pdm

before_script:
  - python --version
  - python -m pip install --upgrade pip setuptools wheel
  - pip install pdm

  # System deps (only if your image doesn't already contain them)
  - |
    apt-get update
    apt-get install -y --no-install-recommends \
      build-essential \
      default-jdk \
      libldap2-dev \
      libsasl2-dev \
      libssl-dev
    rm -rf /var/lib/apt/lists/*

  # Install project deps including dev deps (pytest lives there)
  - pdm install --dev

pytest:
  stage: test
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  script:
    - pdm run pytest -q --cov=. --cov-report=term-missing --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml