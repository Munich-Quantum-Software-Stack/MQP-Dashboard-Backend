name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Private index settings (from your GitLab file)
      PIP_EXTRA_INDEX_URL: https://pypi.quantum.lrz.de/
      PIP_TRUSTED_HOST: pypi.quantum.lrz.de

      # Test env vars (from your GitLab file)
      QUANTUM_DS_HOST: ldap://localhost:25334
      QUANTUM_DB_FILENAME: test_db.db
      QUANTUM_DB_TESTING: "1"

      # PDM settings (from your GitLab file)
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_CHECK_UPDATE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-jdk \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev

      - name: Install PDM + project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pdm
          pdm install --dev

      - name: Run tests
        run: pdm run pytest -q