name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci-public:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run public CI test subset
        run: python -m pytest -q ci_tests

      - name: CI scope note
        run: |
          echo "This CI run intentionally covers only tests that do not require private PyPI or DB-backed components."
          echo "Run the full integration test suite locally in an environment with private dependencies and DB access."