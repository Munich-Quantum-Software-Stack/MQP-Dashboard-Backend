name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            default-jdk \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev

      - name: Install Python dependencies
        env:
          PDM_IGNORE_SAVED_PYTHON: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel pdm
          pdm install --dev

      - name: Run test suite
        run: pdm run pytest -q