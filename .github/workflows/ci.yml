name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_CHECK_UPDATE: "0"
      QUANTUM_DB_TESTING: "TRUE"
      QUANTUM_DB_FILENAME: test_db.sqlite
      QUANTUM_DB_USER: postgres
      QUANTUM_DB_PASS: example
      QUANTUM_DB_HOST: localhost
      QUANTUM_DB_PEPPER: test-pepper
      QUANTUM_DB_TOKEN_PEPPER: test-token-pepper
      JWT_SECRET_KEY: test-jwt-secret
      QUANTUM_DS_HOST: "ldap://localhost:8888"
      LDAP_USER_DN: "ou=QuantumComputing,ou=Kennungen,o=example-org,c=de"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          gcc \
          build-essential \
          python3-dev \
          libldap2-dev \
          libsasl2-dev \
          libssl-dev \
          sssd-ldap \
          slapd \
          ldap-utils \
          libldap-common \
          tox \
          lcov \
          valgrind \
          openjdk-17-jre

      - name: Install UV
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Pylint
        run: uv run pylint mqp_dashboard_backend/

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --config .pre-commit-config-ci.yaml

      - name: Run Pytest with coverage
        run: uv run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Switch to true (as in QDMI) once the repository is registered with Codecov.
          fail_ci_if_error: false
          files: coverage.xml
          flags: python

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - ci
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
