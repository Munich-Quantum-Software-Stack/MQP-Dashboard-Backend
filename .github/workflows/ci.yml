name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_CHECK_UPDATE: "0"
      QUANTUM_DB_TESTING: "TRUE"
      QUANTUM_DB_FILENAME: test_db.sqlite
      QUANTUM_DB_USER: postgres
      QUANTUM_DB_PASS: example
      QUANTUM_DB_HOST: localhost:5432
      QUANTUM_DB_PEPPER: ci-test-pepper
      QUANTUM_DB_TOKEN_PEPPER: ci-test-token-pepper
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Add UV to the environment
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Linting
        run: uv run pylint mqp_dashboard_backend/

      - name: Install test tooling
        run: uv sync --group dev

      - name: Run pre-commit
        run: |
          uv run --active pre-commit run --all-files --config .pre-commit-config-ci.yaml

      - name: Upgrade pip
        run: |
          python -m ensurepip --default-pip
          python -m pip install --upgrade pip

      - name: Run tests
        run: |
          uv run python -m pytest tests

      - name: Continuous Integration scope note
        run: |
          echo "This Continuous Integration run intentionally covers only tests that do not require private PyPI or DB-backed components."
          echo "Run the full integration test suite locally in an environment with private dependencies and DB access."

      - name: Run Pytest with coverage
        run: |
          uv run pytest -s --maxfail=1 --disable-warnings --cov=mqp_dashboard_backend --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
