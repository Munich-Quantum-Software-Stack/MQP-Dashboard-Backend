name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_CHECK_UPDATE: "0"
      # PIP_EXTRA_INDEX_URL: "https://pypi.quantum.lrz.de/"
      # PIP_TRUSTED_HOST: "pypi.quantum.lrz.de"
      QUANTUM_DS_HOST: "ldap://localhost:8888"
      QUANTUM_DB_FILENAME: "test_db.sqlite"
      QUANTUM_DB_TESTING: "TRUE"
      QUANTUM_DB_USER: "postgres"
      QUANTUM_DB_PASS: "example"
      QUANTUM_DB_HOST: "localhost:5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-jdk \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pdm

      - name: Install dependencies
        run: python -m pdm install --dev -vv

      - name: Install coverage plugin
        run: python -m pdm run python -m pip install pytest-cov

      - name: Run pytest with coverage
        run: python -m pdm run pytest -q --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error