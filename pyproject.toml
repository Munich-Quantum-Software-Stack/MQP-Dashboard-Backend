[project]
name = "mqp-dashboard-backend"
version = "1.0.0"
description = "MQP Dashboard Backend"
authors = [
    {name = "Tobias Bauer", email = "tobias.bauer@lrz.de"},
    {name = "Trang Huynh", email = "Trang.Huynh@lrz.de"},
    {name = "Ege Özmeral", email = "Nazim.Oezmeral@lrz.de" }
]
dependencies = [
    "flask>=2.3.2",
    "bqp-database-access>=0.3.32",
    "pony>=0.7.16",
    "flask-jwt-extended>=4.5.2",
    "gunicorn>=21.2.0",
    "flask-cors>=4.0.0",
    "python-ldap>=3.4.3",
    "flask-mail>=0.10.0",
    "influxdb>=5.3.2",
    "python-dotenv>=1.2.2",
    "eliot>=1.18.0"
]

requires-python=">=3.11,<3.12"
readme = "README.md"
license = {text = "MIT"}

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "nox",
    "pre-commit",
    "pytest>=7.4.0",
    "pytest-env>=0.8.2",
    "python-ldap-test>=0.3.1",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.2",
    "mkdocstrings[python]>=0.26.1",
    "mkdocs-autorefs>=1.2.0",
]

[tool.pdm]
distribution = true
cross_platform = true

[[tool.pdm.source]]
name = "lrz_pypi"
url = "https://pypi.quantum.lrz.de"

[tool.setuptools]
packages = ["mqp_dashboard_backend"]

[[tool.uv.index]]
url = "https://pypi.quantum.lrz.de"
