[project]
name = ""
version = ""
description = ""
authors = [
    {name = "Martin Ruefenacht", email = "martin.ruefenacht@lrz.de"},
]
dependencies = [
    "flask>=2.3.2",
    "bqp-database-access>=0.2.20",
    "pony>=0.7.16",
    "flask-jwt-extended>=4.5.2",
    "gunicorn>=21.2.0",
    "flask-cors>=4.0.0",
    "python-ldap>=3.4.3",
    "eliot[journald]>=1.15.0",
]
requires-python = ">=3.10,<3.12"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-env>=0.8.2",
    "python-ldap-test>=0.3.1",
]

[tool.pytest.ini_options]
env = [
    "QUANTUM_DB_TESTING=TRUE",
    "QUANTUM_DB_FILENAME=test_db.sqlite",
    "QUANTUM_DS_HOST=ldap://localhost:8888",
    "QUANTUM_DB_USER=",
    "QUANTUM_DB_PASS=",
    "QUANTUM_DB_HOST="
]
pythonpath = ["."]


[[tool.pdm.source]]
name = "lrz_pypi"
url = "http://pypi.quantum.lrz.de:8080/"
verify_ssl = false

[tool.isort]
profile = "black"
